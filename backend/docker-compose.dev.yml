# Development override — runs only infrastructure services
# Usage: docker-compose -f docker-compose.dev.yml up -d
# Then run the API locally: dotnet run --project src/TaskOps.API

services:

  postgres:
    image: postgres:16-alpine
    container_name: taskops-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskops_dev
      POSTGRES_USER: taskops_user
      POSTGRES_PASSWORD: taskops_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: taskops-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data: